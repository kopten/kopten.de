name = "kopten-de-files"
main = "src/index.js"
account_id = "b24ece17d5e54c71ab7e1c062cd0d955"
compatibility_date = "2026-06-01"

workers_dev = false

# Manifest-Endpunkt liegt unter files-api.kopten.de — Routing via Worker Route.
routes = [
  { pattern = "files-api.kopten.de/*", zone_name = "kopten.de" }
]

# Bindings — passt im CF-Dashboard automatisch, sobald der Bucket existiert.
[[r2_buckets]]
binding = "FILES"
bucket_name = "kopten-de-files"
jurisdiction = "eu"

[observability]
enabled = true
head_sampling_rate = 1

# Secrets (gesetzt via wrangler secret put):
#   GITHUB_REPO            — "kopten/kopten.de"
#   GITHUB_DISPATCH_TOKEN  — Fine-grained PAT mit "Contents: read/write"
#                            (repository_dispatch braucht Contents, nicht Actions)
#   ADMIN_TOKEN            — Shared Secret zum Schutz der /rebuild-manifest Route
